<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="Art portfolio of Ohyun Kwon.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <script>document.documentElement.className = 'js';</script>
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</head>
<body><a class="skip-link" href="#main">Skip to content</a>
{{ partial "header.html" . }}<main id="main">{{ block "main" . }}{{ end }}</main>{{ partial "footer.html" . }}
</body></html>
